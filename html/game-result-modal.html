<div id="game-result-modal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="game-result-modal-title">
        <div class="modal-header">
            <h2 id="game-result-modal-title" class="modal-title">Nhập kết quả game</h2>
        </div>

        <div class="modal-body">
            <div class="game-result-form">
                <div class="empty-note">Modal nhập kết quả game đang chờ phần form chi tiết.</div>
            </div>
        </div>

        <div class="modal-footer">
            <div class="modal-footer-actions">
                <button id="cancel-game-result-modal" class="btn btn-secondary" type="button">Cancel</button>
                <button id="confirm-game-result-modal" class="btn" type="button">OK</button>
            </div>
        </div>
    </div>
</div>
